name: Application CI

on:
  pull_request:
  push:
    branches: [main, dev, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  GEMINI_API_KEY: ''
  GOOGLE_API_KEY: ''

jobs:
  frontend:
    name: Frontend / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, 'test:regressions', build, audit]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run quality check
        if: matrix.check != 'audit'
        env:
          CHECK: ${{ matrix.check }}
        run: npm run "$CHECK"
      - name: Audit production dependencies
        if: matrix.check == 'audit'
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [django, fastapi]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/django_app/requirements/*.txt
            backend/fastapi_app/requirements.txt
      - name: Install Django and CI dependencies
        run: python -m pip install -r backend/django_app/requirements/ci.txt
      - name: Install FastAPI dependencies
        if: matrix.service == 'fastapi'
        run: python -m pip install -r backend/fastapi_app/requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q backend/django_app backend/fastapi_app backend/shared
      - name: Check Django configuration and migration consistency
        if: matrix.service == 'django'
        working-directory: backend/django_app
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run shared vector-store tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/shared/tests -v
      - name: Run Django regression tests
        if: matrix.service == 'django'
        working-directory: backend/django_app
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py test apps.users apps.dashboard apps.classroom --verbosity=2
      - name: Run FastAPI tests without cloud credentials or model downloads
        if: matrix.service == 'fastapi'
        working-directory: backend/fastapi_app
        run: python -m unittest discover -s app/tests -v
      - name: Test audit version normalization
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Audit installed Python dependencies
        run: |
          python .github/scripts/export_audit_requirements.py > /tmp/audit-requirements.txt
          python -m pip_audit --strict --no-deps --disable-pip --progress-spinner off -r /tmp/audit-requirements.txt

  quality-gate:
    name: CI / Quality gate
    if: always()
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize checks and require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          results = json.loads(os.environ['RESULTS'])
          rows = ['## CI results', '', '| Group | Result |', '| --- | --- |']
          rows.extend(f'| {name} | {job["result"]} |' for name, job in results.items())
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(rows) + '\n')
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required checks did not pass: ' + ', '.join(failed))
          PY
